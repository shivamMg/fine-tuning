name: langgraph-chat-responses
description: >
  Multi-turn chat agent built with LangGraph and Azure OpenAI using the
  responses protocol.  Demonstrates a tool-calling agent graph (chatbot ↔ tools)
  with server-side conversation state via previous_response_id.
  Includes get_current_time and calculator tools.
metadata:
  tags:
    - AI Agent Hosting
    - Azure AI AgentServer
    - LangGraph
    - LangChain
template:
  name: langgraph-chat-responses
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    - name: AZURE_OPENAI_ENDPOINT
      value: ${AZURE_OPENAI_ENDPOINT}
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{chat}}"
resources:
  - kind: model
    id: gpt-4o
    name: chat
